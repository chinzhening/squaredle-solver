name: Daily Squaredle

# Squaredle rolls over a new puzzle at UTC+8, so any time after that
# gets the current day's board. workflow_dispatch is kept for manual re-runs
# when a scheduled run fails.
on:
  schedule:
    - cron: "30 10 * * *" # 6:30PM MYT
  workflow_dispatch:

# The job only reads the repo; results go to MongoDB, not back to git.
permissions:
  contents: read

jobs:
  squaredle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      # Build the C++ solver. cpp/build/ is gitignored, so the binary and its
      # word lists have to be produced fresh on every run.
      - name: Install C++ build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++
      - name: Build C++ executable
        working-directory: cpp
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      # Set up the Python side. working-directory points uv at python/ so it
      # picks up .python-version and pyproject.toml; --no-dev skips the lint
      # and test tooling, which the solve does not need.
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 #v9.0.0
        with:
          working-directory: python
          enable-cache: true
      - name: Install Python dependencies
        working-directory: python
        run: |
          uv sync --no-dev
      - name: Install playwright browsers
        working-directory: python
        run: |
          uv run --no-dev playwright install --with-deps chromium

      # Scrape the board, solve it, and write the result. SOLVER_PATH is
      # overridden because config.py defaults to the Windows main.exe, while
      # this runner builds cpp/build/main.
      - name: Solve Squaredle
        working-directory: python
        run: |
          uv run --no-dev python main.py
        env:
          SOLVER_PATH: ${{ github.workspace }}/cpp/build/main
          ENABLE_MONGO_WRITER: "true"
          MONGO_URI: ${{ secrets.MONGO_URI }}
