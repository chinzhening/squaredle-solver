name: Daily Squaredle

# Squaredle rolls over a new puzzle at UTC+8, so any time after that
# gets the current day's board. workflow_dispatch is kept for manual re-runs
# when a scheduled run fails.
on:
  schedule:
    - cron: "30 10 * * *" # 6:30PM MYT
  workflow_dispatch:

# The job only reads the repo; results go to MongoDB, not back to git.
permissions:
  contents: read

jobs:
  squaredle:
    runs-on: ubuntu-latest
    # Supplies MONGO_URI
    environment: daily-run
    timeout-minutes: 20
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      # Build the C++ solver. cpp/build/ is gitignored, so the binary and the
      # word lists copied beside it only survive between runs via this cache.
      # The key covers cpp/data/ too, since CMake copies it into the build dir.
      # ubuntu-latest already ships cmake and g++, so nothing needs installing.
      - name: Cache C++ build
        id: cache-cpp
        uses: actions/cache@v6
        with:
          path: cpp/build
          key: cpp-${{ runner.os }}-${{ hashFiles('cpp/CMakeLists.txt', 'cpp/src/**', 'cpp/benchmark/**', 'cpp/data/**') }}
      - name: Build C++ executable
        if: steps.cache-cpp.outputs.cache-hit != 'true'
        working-directory: cpp
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      # Set up the Python side. working-directory points uv at python/ so it
      # picks up .python-version and pyproject.toml; --no-dev skips the lint
      # and test tooling, which the solve does not need.
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 #v9.0.0
        with:
          working-directory: python
          enable-cache: true
      - name: Install Python dependencies
        working-directory: python
        run: |
          uv sync --no-dev

      # The chromium bundle is the largest download in the run. Only the
      # browser caches; --with-deps installs system libraries apt-side, which
      # no cache can restore, so the install step still runs on a hit and
      # simply skips the download.
      - name: Cache playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('python/uv.lock') }}
      - name: Install playwright browsers
        working-directory: python
        run: |
          uv run --no-dev playwright install --with-deps chromium

      # Scrape the board, solve it, and write the result. SOLVER_PATH is
      # overridden because config.py defaults to the Windows main.exe, while
      # this runner builds cpp/build/main.
      - name: Solve Squaredle
        working-directory: python
        run: |
          uv run --no-dev python main.py
        env:
          SOLVER_PATH: ${{ github.workspace }}/cpp/build/main
          ENABLE_MONGO_WRITER: "true"
          MONGO_URI: ${{ secrets.MONGO_URI }}
